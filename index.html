document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Fsc-if>\n\n              <div style=\"background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:18px;padding:18px;backdrop-filter:blur(20px);\">\n                <div style=\"font-size:13px;font-weight:600;margin-bottom:14px;\">Impact Score<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:16px;\">\n                  <div style=\"{{ impactRingStyle }}\"><div style=\"{{ impactRingInnerStyle }}\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;\">76<\u002Fspan><\u002Fdiv><\u002Fdiv>\n                  <div><div style=\"font-size:11.5px;color:#34D399;font-weight:600;\">↑ 6 vs last wk<\u002Fdiv><div style=\"font-size:11px;color:rgba(243,241,255,0.45);margin-top:3px;\">out of 100<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- TEAMS -->\n        <sc-if value=\"{{ isTeams }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-bottom:4px;\">Team Eng<\u002Fdiv>\n          <div style=\"font-size:13px;color:rgba(243,241,255,0.5);margin-bottom:24px;\">Led by Sarah Malik · 5 members<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:2fr 1fr;gap:20px;\">\n            <div style=\"background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:18px;padding:8px;backdrop-filter:blur(20px);\">\n              <sc-for list=\"{{ teamMembers }}\" as=\"m\" hint-placeholder-count=\"5\">\n                <div sc-camel-on-click=\"{{ m.onClick }}\" style=\"display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;\">\n                  <span style=\"{{ m.avatarStyle }}\">{{ m.initial }}<\u002Fspan>\n                  <div style=\"flex:1;\"><div style=\"font-size:13.5px;font-weight:600;\">{{ m.name }}<\u002Fdiv><div style=\"font-size:11.5px;color:rgba(243,241,255,0.45);\">{{ m.role }}<\u002Fdiv><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(243,241,255,0.5);\"><span style=\"{{ m.statusDot }}\"><\u002Fspan>{{ m.statusLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ m.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:12px 16px 16px 64px;display:flex;gap:10px;background:rgba(255,255,255,0.02);\">\n                    <div style=\"padding:7px 14px;border-radius:8px;background:rgba(255,255,255,0.06);font-size:11.5px;cursor:pointer;\">Message<\u002Fdiv>\n                    <div style=\"padding:7px 14px;border-radius:8px;background:rgba(255,255,255,0.06);font-size:11.5px;cursor:pointer;\">View profile<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:16px;\">\n              <div style=\"background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:18px;padding:18px;\">\n                <div style=\"font-size:13px;font-weight:600;margin-bottom:10px;\">Team shortcuts<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ goComms }}\" style=\"padding:10px 0;font-size:12.5px;color:rgba(243,241,255,0.75);cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.05);\">💬 Open team chat<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ goFloVault }}\" style=\"padding:10px 0;font-size:12.5px;color:rgba(243,241,255,0.75);cursor:pointer;\">🗂 Team documents in FloVault<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:18px;padding:18px;\">\n                <div style=\"font-size:13px;font-weight:600;margin-bottom:4px;\">Team lead access<\u002Fdiv>\n                <div style=\"font-size:12px;color:rgba(243,241,255,0.5);line-height:1.5;margin-bottom:10px;\">Switch role to Team Lead to preview approvals, PTO requests, and team management tools.<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ previewAsTeamLead }}\" style=\"display:inline-block;padding:8px 14px;border-radius:9px;background:rgba(255,255,255,0.06);font-size:11.5px;cursor:pointer;\">Preview as Team Lead<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- PROJECTS / TASKS -->\n        <sc-if value=\"{{ isProjects }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;\">Projects &amp; Tasks<\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center;\">\n              <div style=\"display:flex;background:rgba(255,255,255,0.05);border-radius:10px;padding:3px;\">\n                <div sc-camel-on-click=\"{{ setTasksTabTasks }}\" style=\"{{ tasksTabStyleTasks }}\">Tasks<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ setTasksTabProjects }}\" style=\"{{ tasksTabStyleProjects }}\">Projects<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ openAssignTask }}\" style=\"padding:9px 16px;border-radius:10px;background:linear-gradient(135deg,#8B7CF6,#45CFFF);font-size:12.5px;font-weight:600;cursor:pointer;color:#0a0a14;\">Assign Task<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ isTasksTab }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:10px;\">\n              <sc-for list=\"{{ tasks }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;\">\n                  <span sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.checkboxStyle }}\"><\u002Fspan>\n                  <div style=\"flex:1;\"><div style=\"{{ t.titleStyle }}\">{{ t.title }}<\u002Fdiv><div style=\"font-size:11.5px;color:rgba(243,241,255,0.4);margin-top:2px;\">{{ t.project }}<\u002Fdiv><\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:rgba(243,241,255,0.5);\">{{ t.due }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isProjectsTab }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;\">\n              <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-click=\"{{ p.onClick }}\" style=\"{{ p.cardStyle }}\">\n                  <div style=\"width:34px;height:34px;border-radius:10px;background:{{ p.color }};opacity:0.85;margin-bottom:14px;\"><\u002Fdiv>\n                  <div style=\"font-size:14.5px;font-weight:600;\">{{ p.name }}<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:rgba(243,241,255,0.45);margin-bottom:12px;\">{{ p.team }}<\u002Fdiv>\n                  <div style=\"height:5px;border-radius:4px;background:rgba(255,255,255,0.08);overflow:hidden;margin-bottom:6px;\"><div style=\"{{ p.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n                  <div style=\"font-size:11px;color:rgba(243,241,255,0.5);\">{{ p.progress }}% complete<\u002Fdiv>\n                  <sc-if value=\"{{ p.expanded }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06);font-size:11.5px;color:rgba(243,241,255,0.6);line-height:1.5;\">On track · next milestone Friday · 3 open tasks assigned to your team.<\u002Fdiv><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <!-- FLOVAULT -->\n        <sc-if value=\"{{ isFloVault }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;\">FloVault<\u002Fdiv>\n            <div style=\"display:flex;gap:10px;\">\n              <input value=\"{{ fileSearch }}\" sc-camel-on-change=\"{{ onFileSearchChange }}\" placeholder=\"Search files…\" style=\"padding:9px 16px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);font-size:12.5px;color:#F3F1FF;width:180px;\">\n              <div sc-camel-on-click=\"{{ onUploadClick }}\" style=\"padding:9px 16px;border-radius:10px;background:linear-gradient(135deg,#8B7CF6,#45CFFF);font-size:12.5px;font-weight:600;cursor:pointer;color:#0a0a14;\">Upload<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px;\">\n            <sc-for list=\"{{ folders }}\" as=\"fo\" hint-placeholder-count=\"5\">\n              <div sc-camel-on-click=\"{{ fo.onClick }}\" style=\"{{ fo.cardStyle }}\">\n                <div style=\"width:26px;height:20px;border-radius:4px;background:rgba(69,207,255,0.25);border:1px solid rgba(69,207,255,0.5);margin:0 auto 10px;\"><\u002Fdiv>\n                <div style=\"font-size:12px;font-weight:600;\">{{ fo.name }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ selectedFolder }}\" hint-placeholder-val=\"{{ false }}\"><div sc-camel-on-click=\"{{ clearFolderFilter }}\" style=\"display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:rgba(139,124,246,0.15);border:1px solid rgba(139,124,246,0.35);font-size:11.5px;margin-bottom:14px;cursor:pointer;\">Filtering: {{ selectedFolder }} ✕<\u002Fdiv><\u002Fsc-if>\n          <div style=\"font-size:13px;font-weight:600;margin-bottom:10px;\">Recent files<\u002Fdiv>\n          <div style=\"background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:16px;\">\n            <sc-for list=\"{{ files }}\" as=\"f\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ f.onClick }}\" style=\"{{ f.rowStyle }}\">\n                <span style=\"width:28px;height:34px;border-radius:4px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);flex:none;\"><\u002Fspan>\n                <div style=\"flex:1;\"><div style=\"font-size:13px;font-weight:600;\">{{ f.name }}<\u002Fdiv><div style=\"font-size:11px;color:rgba(243,241,255,0.4);\">{{ f.type }} · {{ f.folder }}<\u002Fdiv><\u002Fdiv>\n                <div style=\"font-size:11.5px;color:rgba(243,241,255,0.5);\">{{ f.updated }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ noFilesFound }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:24px;text-align:center;font-size:12.5px;color:rgba(243,241,255,0.4);\">No files match your search.<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- COMMUNICATION -->\n        <sc-if value=\"{{ isComms }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-bottom:20px;\">Communication<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:280px 1fr;gap:20px;height:calc(100vh - 180px);\">\n            <div style=\"background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;\">\n              <div style=\"display:flex;padding:10px;gap:4px;border-bottom:1px solid rgba(255,255,255,0.06);\">\n                <div sc-camel-on-click=\"{{ setCommsTabTeam }}\" style=\"{{ commsTabStyleTeam }}\">Team<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ setCommsTabDm }}\" style=\"{{ commsTabStyleDm }}\">1:1<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ setCommsTabAi }}\" style=\"{{ commsTabStyleAi }}\">AI<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"overflow-y:auto;flex:1;\">\n                <sc-for list=\"{{ activeChatList }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <div sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.rowStyle }}\">\n                    <span style=\"width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#8B7CF6,#45CFFF);flex:none;\"><\u002Fspan>\n                    <div style=\"flex:1;min-width:0;\"><div style=\"font-size:13px;font-weight:600;\">{{ c.name }}<\u002Fdiv><div style=\"font-size:11.5px;color:rgba(243,241,255,0.45);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ c.last }}<\u002Fdiv><\u002Fdiv>\n                    <sc-if value=\"{{ c.hasUnread }}\"><span style=\"width:18px;height:18px;border-radius:50%;background:#45CFFF;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#090a14;flex:none;\">{{ c.unread }}<\u002Fspan><\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:relative;background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.06);\">\n                <div>\n                  <div style=\"font-size:14px;font-weight:600;\">{{ activeChatName }}<\u002Fdiv>\n                  <sc-if value=\"{{ activeChatMembers }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:11px;color:rgba(243,241,255,0.45);margin-top:2px;\">{{ activeChatMembers }}<\u002Fdiv><\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:8px;\">\n                  <span sc-camel-on-click=\"{{ startAudioCall }}\" style=\"width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;cursor:pointer;\"><span style=\"width:11px;height:16px;border-radius:6px;border:1.5px solid #45CFFF;\"><\u002Fspan><\u002Fspan>\n                  <span sc-camel-on-click=\"{{ startVideoCall }}\" style=\"width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;cursor:pointer;\"><span style=\"width:14px;height:10px;border-radius:2px;border:1.5px solid #34D399;\"><\u002Fspan><\u002Fspan>\n                  <span sc-camel-on-click=\"{{ togglePresent }}\" style=\"width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;cursor:pointer;\" title=\"Presentation mode\"><span style=\"width:14px;height:10px;border:1.5px solid #FBBF24;border-radius:2px;\"><\u002Fspan><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;\">\n                <sc-for list=\"{{ activeMessages }}\" as=\"msg\" hint-placeholder-count=\"4\"><div style=\"{{ msg.rowStyle }}\"><div style=\"{{ msg.bubbleStyle }}\">{{ msg.text }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"padding:14px 18px;border-top:1px solid rgba(255,255,255,0.06);display:flex;gap:10px;\">\n                <input value=\"{{ chatInputText }}\" sc-camel-on-change=\"{{ onChatInputChange }}\" placeholder=\"Message {{ activeChatName }}…\" style=\"flex:1;padding:11px 14px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);font-size:13px;color:#F3F1FF;\">\n                <div sc-camel-on-click=\"{{ sendChatMessage }}\" style=\"{{ sendBtnStyle }}\">Send<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ callActive }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"position:absolute;inset:0;background:rgba(9,10,20,0.92);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;\">\n                  <div style=\"position:relative;width:88px;height:88px;display:flex;align-items:center;justify-content:center;\">\n                    <span style=\"position:absolute;width:88px;height:88px;border-radius:50%;border:1.5px solid #45CFFF;animation:fb-ring 1.8s infinite;\"><\u002Fspan>\n                    <span style=\"width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#8B7CF6,#45CFFF);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;\">{{ activeChatInitial }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:15px;font-weight:600;\">{{ callTypeLabel }} {{ activeChatName }}…<\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ endCall }}\" style=\"padding:11px 26px;border-radius:11px;background:#F87171;color:#0a0a14;font-size:12.5px;font-weight:700;cursor:pointer;\">End call<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ presentMode }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"position:absolute;inset:0;background:rgba(9,10,20,0.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;\">\n                  <div style=\"font-size:13px;color:rgba(243,241,255,0.5);\">🎥 Presentation mode — optimized for demos and investor meetings<\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ togglePresent }}\" style=\"padding:10px 22px;border-radius:10px;background:rgba(255,255,255,0.08);font-size:12.5px;cursor:pointer;\">Exit present<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- TIME TRACKING -->\n        <sc-if value=\"{{ isTime }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-bottom:20px;\">Time Tracking<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 320px;gap:20px;\">\n            <div style=\"display:flex;flex-direction:column;gap:16px;\">\n              <div style=\"background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:20px;padding:28px;text-align:center;\">\n                <input value=\"{{ trackingTitle }}\" sc-camel-on-change=\"{{ onTrackingTitleChange }}\" style=\"text-align:center;font-size:13px;color:rgba(243,241,255,0.7);background:transparent;border:none;border-bottom:1px dashed rgba(255,255,255,0.15);padding:0 0 4px;margin-bottom:14px;width:280px;\">\n                <div style=\"font-family:'Space Grotesk',sans-serif;font-size:48px;font-weight:700;letter-spacing:1px;margin-bottom:18px;\">{{ timerDisplay }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:center;gap:14px;\">\n                  <span sc-camel-on-click=\"{{ toggleTimer }}\" style=\"{{ playButtonStyleLarge }}\"><span style=\"{{ playIconStyleLarge }}\"><\u002Fspan><\u002Fspan>\n                  <div sc-camel-on-click=\"{{ toggleTimer }}\" style=\"{{ timerButtonStyleLarge }}\">{{ timerButtonLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:18px;padding:20px;\">\n                <div style=\"font-size:13px;font-weight:600;margin-bottom:14px;\">This week<\u002Fdiv>\n                <div style=\"display:flex;align-items:flex-end;gap:16px;height:100px;\">\n                  <sc-for list=\"{{ weekData }}\" as=\"w\" hint-placeholder-count=\"5\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;\"><div style=\"{{ w.barStyle }}\"><\u002Fdiv><div style=\"font-size:11px;color:rgba(243,241,255,0.45);\">{{ w.day }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:18px;\">\n                <div style=\"padding:16px 20px;font-size:13px;font-weight:600;border-bottom:1px solid rgba(255,255,255,0.06);\">Today's log<\u002Fdiv>\n                <sc-for list=\"{{ timeLog }}\" as=\"l\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.05);\">\n                    <div style=\"flex:1;\"><div style=\"font-size:13px;font-weight:600;\">{{ l.task }}<\u002Fdiv><div style=\"font-size:11px;color:rgba(243,241,255,0.4);\">{{ l.project }}<\u002Fdiv><\u002Fdiv>\n                    <div style=\"font-size:12.5px;color:rgba(243,241,255,0.6);\">{{ l.duration }}<\u002Fdiv>\n                    <sc-if value=\"{{ l.synced }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"{{ l.syncDot }}\"><\u002Fspan><\u002Fsc-if>\n                    <sc-if value=\"{{ l.notSynced }}\" hint-placeholder-val=\"{{ false }}\"><span sc-camel-on-click=\"{{ l.onSyncClick }}\" style=\"font-size:11px;padding:4px 10px;border-radius:7px;background:rgba(69,207,255,0.15);color:#45CFFF;cursor:pointer;\">Sync now<\u002Fspan><\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:18px;padding:20px;\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;\"><span style=\"width:26px;height:26px;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#090a14;\">N<\u002Fspan><div style=\"font-size:13px;font-weight:600;\">Notion integration<\u002Fdiv><\u002Fdiv>\n              <div style=\"font-size:12.5px;color:rgba(243,241,255,0.6);line-height:1.6;margin-bottom:14px;\">Connected to workspace <strong style=\"color:#F3F1FF;\">FloLabs HQ<\u002Fstrong>. Every logged entry syncs to your Notion time-tracking database automatically.<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid rgba(255,255,255,0.06);font-size:12px;\"><span style=\"color:rgba(243,241,255,0.5);\">Last synced<\u002Fspan><span>{{ notionLastSynced }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid rgba(255,255,255,0.06);font-size:12px;\"><span style=\"color:rgba(243,241,255,0.5);\">Status<\u002Fspan><span style=\"color:#34D399;\">Connected<\u002Fspan><\u002Fdiv>\n              <div sc-camel-on-click=\"{{ syncAllNow }}\" style=\"margin-top:14px;text-align:center;padding:10px;border-radius:10px;background:rgba(255,255,255,0.06);font-size:12px;font-weight:600;cursor:pointer;\">Sync all now<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- BUDDIES -->\n        <sc-if value=\"{{ isBuddies }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-bottom:20px;\">Buddies AI<\u002Fdiv>\n\n          <!-- DESIGN BUDDY — full workspace -->\n          <sc-if value=\"{{ isDesignBuddyActive }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid;grid-template-columns:220px 1fr;gap:16px;height:calc(100vh - 170px);\">\n              <div style=\"background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:16px;padding:12px;display:flex;flex-direction:column;overflow:hidden;\">\n                <div sc-camel-on-click=\"{{ newDesignChat }}\" style=\"padding:10px;border-radius:9px;background:rgba(249,124,182,0.15);border:1px solid rgba(249,124,182,0.35);color:#F97CB6;font-size:12px;font-weight:700;text-align:center;cursor:pointer;margin-bottom:10px;\">+ New chat<\u002Fdiv>\n                <div style=\"font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:rgba(243,241,255,0.35);padding:4px 6px 8px;\">Past chats<\u002Fdiv>\n                <div style=\"overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:4px;\">\n                  <sc-for list=\"{{ designChatSessions }}\" as=\"dch\" hint-placeholder-count=\"3\">\n                    <div sc-camel-on-click=\"{{ dch.onClick }}\" style=\"{{ dch.rowStyle }}\">\n                      <div style=\"font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ dch.title }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:rgba(243,241,255,0.4);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ dch.preview }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div sc-camel-on-click=\"{{ clearActiveBuddy }}\" style=\"margin-top:8px;padding:9px;border-radius:9px;background:rgba(255,255,255,0.05);font-size:11.5px;text-align:center;cursor:pointer;color:rgba(243,241,255,0.6);\">← All Buddies<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;\">\n                <div style=\"display:flex;align-items:center;justify-conten wDesignFiles }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div sc-camel-on-click=\"{{ goDesignChat }}\" style=\"font-size:12.5px;color:#45CFFF;cursor:pointer;\">← Back<\u002Fdiv>\n                    <div style=\"font-size:14px;font-weight:600;\">Design Buddy · Files<\u002Fdiv>\n                    <div style=\"width:60px;\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n\n                <!-- Chat view -->\n                <sc-if value=\"{{ showDesignChat }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px 0;\">\n                    <sc-for list=\"{{ designAuditActions }}\" as=\"da\" hint-placeholder-count=\"3\">\n                      <div sc-camel-on-click=\"{{ da.onClick }}\" style=\"padding:6px 11px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);font-size:11px;cursor:pointer;\">{{ da.label }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:12px;\">\n                    <sc-for list=\"{{ designSessionMessages }}\" as=\"dm\" hint-placeholder-count=\"1\"><div style=\"{{ dm.rowStyle }}\"><div style=\"{{ dm.bubbleStyle }}\">{{ dm.text }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ designLinkOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"padding:0 18px 12px;display:flex;gap:8px;\">\n                      <input value=\"{{ designLinkText }}\" sc-camel-on-change=\"{{ onDesignLinkChange }}\" placeholder=\"Paste a website or Figma link…\" style=\"flex:1;padding:10px 13px;border-radius:9px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);font-size:12px;color:#F3F1FF;\">\n                      <div sc-camel-on-click=\"{{ submitDesignLink }}\" style=\"padding:10px 16px;border-radius:9px;background:rgba(255,255,255,0.08);font-size:11.5px;font-weight:600;cursor:pointer;\">Add<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"padding:14px 18px;border-top:1px solid rgba(255,255,255,0.06);display:flex;gap:8px;align-items:center;\">\n                    <span sc-camel-on-click=\"{{ toggleDesignVoice }}\" style=\"{{ designVoiceBtnStyle }}\" title=\"Voice input\"><span style=\"width:9px;height:13px;border:1.5px solid currentColor;border-radius:5px;\"><\u002Fspan><\u002Fspan>\n                    <span sc-camel-on-click=\"{{ toggleDesignLink }}\" style=\"width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;\" title=\"Paste a link\"><span style=\"width:12px;height:12px;border:1.5px solid #F3F1FF;border-radius:50%;\"><\u002Fspan><\u002Fspan>\n                    <span sc-camel-on-click=\"{{ onDesignUploadClick }}\" style=\"width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;\" title=\"Upload screenshot/image\"><span style=\"width:12px;height:14px;border:1.5px solid #F3F1FF;border-radius:2px;\"><\u002Fspan><\u002Fspan>\n                    <span sc-camel-on-click=\"{{ onDesignStyleGuideUpload }}\" style=\"width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;\" title=\"Upload brand/style guide\"><span style=\"width:13px;height:11px;border:1.5px solid #F3F1FF;border-radius:2px;\"><\u002Fspan><\u002Fspan>\n                    <input value=\"{{ designInputText }}\" sc-camel-on-change=\"{{ onDesignInputChange }}\" placeholder=\"Message Design Buddy…\" style=\"flex:1;padding:11px 14px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);font-size:12.5px;color:#F3F1FF;\">\n                    <div sc-camel-on-click=\"{{ sendDesignMessage }}\" style=\"{{ sendBtnStyleSmall }}\">Send<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <!-- Tools view -->\n                <sc-if value=\"{{ showDesignTools }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"flex:1;overflow-y:auto;padding:18px;\">\n                    <div style=\"font-size:11.5px;color:rgba(243,241,255,0.45);margin-bottom:14px;\">Drag priority with the arrows to fit your workflow.<\u002Fdiv>\n                    <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;\">\n                      <sc-for list=\"{{ designToolOrder }}\" as=\"dt\" hint-placeholder-count=\"11\">\n                        <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px;\">\n                          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\">\n                            <span style=\"{{ dt.iconStyle }}\">{{ dt.mono }}<\u002Fspan>\n                            <div style=\"display:flex;flex-direction:column;gap:2px;\">\n                              <span sc-camel-on-click=\"{{ dt.onMoveUp }}\" style=\"{{ dt.moveUpStyle }}font-size:10px;\">▲<\u002Fspan>\n                              <span sc-camel-on-click=\"{{ dt.onMoveDown }}\" style=\"{{ dt.moveDownStyle }}font-size:10px;\">▼<\u002Fspan>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                          <div style=\"font-size:12.5px;font-weight:600;margin-bottom:10px;\">{{ dt.name }}<\u002Fdiv>\n                          <div sc-camel-on-click=\"{{ dt.onLaunch }}\" style=\"text-align:center;padding:7px;border-radius:8px;background:rgba(255,255,255,0.06);font-size:11.5px;cursor:pointer;\">Open<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                      <div sc-camel-on-click=\"{{ onAddDesignToolClick }}\" style=\"background:rgba(255,255,255,0.02);border:1px dashed rgba(255,255,255,0.15);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;min-height:96px;\">\n                        <span style=\"font-size:18px;color:rgba(243,241,255,0.4);\">＋<\u002Fspan>\n                        <div style=\"font-size:11.5px;color:rgba(243,241,255,0.5);\">Add Tool<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <!-- Files view -->\n                <sc-if value=\"{{ showDesignFiles }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"flex:1;overflow-y:auto;padding:18px;\">\n                    <input value=\"{{ designVaultSearch }}\" sc-camel-on-change=\"{{ onDesignVaultSearchChange }}\" placeholder=\"Search FloVault for design files…\" style=\"width:100%;padding:11px 14px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);font-size:12.5px;color:#F3F1FF;margin-bottom:18px;\">\n                    <div style=\"font-size:12px;font-weight:600;margin-bottom:8px;color:rgba(243,241,255,0.6);\">From FloVault<\u002Fdiv>\n                    <div style=\"background:rgba(255,255,255,0.03);border-radius:12px;margin-bottom:18px;\">\n                      <sc-for list=\"{{ files }}\" as=\"ff\" hint-placeholder-count=\"3\">\n                        <div style=\"display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,0.05);\">\n                          <span style=\"width:22px;height:28px;border-radius:3px;background:rgba(255,255,255,0.08);flex:none;\"><\u002Fspan>\n                          <div style=\"flex:1;font-size:12.5px;font-weight:600;\">{{ ff.name }}<\u002Fdiv>\n                          <div style=\"font-size:11px;color:rgba(243,241,255,0.4);\">{{ ff.updated }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <div style=\"font-size:12px;font-weight:600;margin-bottom:8px;color:rgba(243,241,255,0.6);\">Uploaded in this chat<\u002Fdiv>\n                    <div style=\"background:rgba(255,255,255,0.03);border-radius:12px;\">\n                      <sc-for list=\"{{ designUploadedFiles }}\" as=\"uf\" hint-placeholder-count=\"2\">\n                        <div style=\"display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,0.05);\">\n                          <span style=\"width:22px;height:28px;border-radius:3px;background:rgba(249,124,182,0.15);border:1px solid rgba(249,124,182,0.3);flex:none;\"><\u002Fspan>\n                          <div style=\"flex:1;font-size:12.5px;font-weight:600;\">{{ uf.name }}<\u002Fdiv>\n                          <div style=\"font-size:11px;color:rgba(243,241,255,0.4);\">{{ uf.type }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- OTHER BUDDIES — standard grid + simple chat -->\n          <sc-if value=\"{{ showStandardBuddyLayout }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:1fr 340px;gap:20px;\">\n            <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-content:start;\">\n              <sc-for list=\"{{ buddies }}\" as=\"b\" hint-placeholder-count=\"8\">\n                <div sc-camel-on-click=\"{{ b.onClick }}\" style=\"{{ b.cardStyle }}\">\n                  <span style=\"{{ b.iconWrap }}\"><span style=\"{{ b.iconShape }}\"><\u002Fspan><\u002Fspan>\n -for list=\"{{ activeBuddyMessages }}\" as=\"bm\" hint-placeholder-count=\"1\"><div style=\"{{ bm.rowStyle }}\"><div style=\"{{ bm.bubbleStyle }}\">{{ bm.text }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin-top:12px;display:flex;gap:8px;\">\n                  <input value=\"{{ buddyInputText }}\" sc-camel-on-change=\"{{ onBuddyInputChange }}\" placeholder=\"Ask {{ activeBuddyName }}…\" style=\"flex:1;padding:11px 14px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);font-size:12.5px;color:#F3F1FF;\">\n                  <div sc-camel-on-click=\"{{ sendBuddyMessage }}\" style=\"{{ sendBtnStyleSmall }}\">Send<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ noBuddySelected }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:rgba(243,241,255,0.4);font-size:12.5px;padding:20px;\">Select a Buddy to start a conversation<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <!-- TOOLS / COCKPIT -->\n        <sc-if value=\"{{ isTools }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-bottom:6px;\">External Tools<\u002Fdiv>\n          <div style=\"font-size:13px;color:rgba(243,241,255,0.5);margin-bottom:22px;\">Connect the tools your team already uses into one cockpit view.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;\">\n            <sc-for list=\"{{ tools }}\" as=\"tl\" hint-placeholder-count=\"8\">\n              <div style=\"background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:16px;padding:18px;\">\n                <div style=\"display:flex;align-items:center;justify-content "display:flex;gap:10px;margin-bottom:20px;\">\n            <sc-for list=\"{{ accentSwatches }}\" as=\"sw\" hint-placeholder-count=\"4\"><span sc-camel-on-click=\"{{ sw.onClick }}\" style=\"{{ sw.style }}\"><\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;font-weight:600;color:rgba(243,241,255,0.5);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;\">Right rail widgets<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:20px;\">\n            <sc-for list=\"{{ widgetToggles }}\" as=\"wt\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ wt.onClick }}\" style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:9px;background:rgba(255,255,255,0.04);cursor:pointer;\">\n                <span style=\"font-size:12.5px;\">{{ wt.label }}<\u002Fspan><span style=\"{{ wt.pillStyle }}\">{{ wt.pillLabel }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ toggleCustomize }}\" style=\"text-align:center;padding:11px;border-radius:10px;background:linear-gradient(135deg,#8B7CF6,{{ accentColor }});color:#0a0a14;font-size:13px;font-weight:700;cursor:pointer;\">Save layout<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- SHORTCUTS MODAL -->\n    <sc-if value=\"{{ shortcutsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div sc-camel-on-click=\"{{ toggleShortcuts }}\" style=\"position:absolute;inset:0;background:rgba(5,5,12,0.6);backdrop-filter:blur(2px);z-index:80;display:flex;align-items:center;justify-content:center;animation:fb-fade-in .12s ease;\">\n        <div sc-camel-on-click=\"{{ stopProp }}\" style=\"width:360px;background:rgba(16,14,30,0.98);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,0.5);\">\n          <div style=\"font-family:'Space Gro
